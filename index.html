<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Card Scanner - AI & Offline Business Card Reader</title>
    <meta name="description" content="Capture visiting cards, extract with Gemini AI or offline OCR, and save to Google Sheet" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" class="app-layout">
      <!-- Top App Bar -->
      <header class="app-header">
        <div class="header-left">
          <div class="header-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="5" width="20" height="14" rx="2"></rect>
              <line x1="2" y1="10" x2="22" y2="10"></line>
            </svg>
          </div>
          <div class="header-titles">
            <h1 class="header-title">Card Scanner</h1>
            <span id="current-mode-badge" class="badge badge-mode">AI Mode</span>
          </div>
        </div>

        <div class="header-actions">
          <!-- Network Status Pill -->
          <div id="network-status-pill" class="status-pill status-online" title="Network status">
            <span class="status-dot"></span>
            <span class="status-text">Online</span>
          </div>
          <!-- Install PWA button (shown when installable) -->
          <button id="pwa-install-btn" class="btn-icon" style="display: none;" title="Install Card Scanner App">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Main Dynamic Content Container -->
      <main id="view-container" class="view-container" role="main"></main>

      <!-- Bottom Tab Bar -->
      <nav class="bottom-nav" aria-label="Main Navigation">
        <a href="#/scan" class="nav-tab active" data-view="scan" id="tab-scan">
          <span class="nav-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </span>
          <span class="nav-label">Scan</span>
        </a>

        <a href="#/review" class="nav-tab" data-view="review" id="tab-review">
          <span class="nav-icon has-badge-container">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <span id="review-active-dot" class="nav-dot-badge" style="display: none;"></span>
          </span>
          <span class="nav-label">Review</span>
        </a>

        <a href="#/history" class="nav-tab" data-view="history" id="tab-history">
          <span class="nav-icon has-badge-container">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span id="history-pending-badge" class="nav-count-badge" style="display: none;">0</span>
          </span>
          <span class="nav-label">History</span>
        </a>

        <a href="#/settings" class="nav-tab" data-view="settings" id="tab-settings">
          <span class="nav-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </span>
          <span class="nav-label">Settings</span>
        </a>
      </nav>

      <!-- Global Toast Container -->
      <div id="toast-container" class="toast-container" aria-live="polite"></div>

      <!-- Global Modal Container -->
      <div id="modal-container" class="modal-container" style="display: none;"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
